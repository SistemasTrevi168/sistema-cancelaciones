# Pruebas automáticas: GitHub las corre en cada "git push" a main.
# - Backend: levanta una base PostgreSQL vacía y corre backend/tests/test_sistema.py
# - Frontend: instala dependencias y compila (si no compila, Vercel tampoco podría publicarlo)
# Si algo falla, en GitHub aparece una ❌ en el commit y te llega un correo.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pruebas
      RESPALDOS_DESACTIVADOS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt httpx
      - name: Revisar que el código no tenga errores de sintaxis
        run: python -m py_compile *.py
      - name: Correr las pruebas
        run: python tests/test_sistema.py

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
